global
    log stdout format raw local0
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 600 level admin

defaults
    log global
    mode tcp
    retries 3
    option redispatch
    timeout connect 3s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend http
    bind :80
    default_backend http_proxies

frontend https
    bind :443
    default_backend https_proxies

backend http_proxies
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server a nginx-a:80 check port 8080 inter 2s fall 2 rise 2 send-proxy resolvers docker init-addr libc,none
    server b nginx-b:80 check port 8080 inter 2s fall 2 rise 2 send-proxy resolvers docker init-addr libc,none

backend https_proxies
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server a nginx-a:443 check port 8080 inter 2s fall 2 rise 2 send-proxy resolvers docker init-addr libc,none
    server b nginx-b:443 check port 8080 inter 2s fall 2 rise 2 send-proxy resolvers docker init-addr libc,none
